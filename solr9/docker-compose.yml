services:
  solr9:
    image: solr:9.9
    ports:
      - "8983:8983"
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    container_name: agrisource_solr
    volumes:
      # Configset mapping (schema files)
      - ./cloud-config-set:/opt/solr/server/solr/configsets/agrisource/conf
      # NEW: Persistent data directory
      - ./solr-data:/var/solr
    networks:
      default:
        ipv4_address: 172.19.0.9
    environment:
      SOLR_MODULES: "extraction,langid,ltr,analysis-extras"
    command: ["solr-precreate", "agrisource", "server/solr/configsets/agrisource/conf"]
    restart: unless-stopped
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
