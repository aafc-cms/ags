id: publishing_and_creative_services
title: 'Publishing and Creative Services Request Form'
description: "<p>The information provided below will help initiate your publishing project. Once submitted, Publishing and Creative Services will contact you within two business days.</p>\r\n\r\n<p>If you leave this page before submitting your form, the information will be lost.</p>"
category: 'Services Request Form'
elements: "psrf_pagedescription:\n  '#type': processed_text\n  '#text': |\n    <p>The information provided below will help initiate your publishing project. Once submitted, Publishing and Creative Services will contact you within two business days.</p>\n    \n    <p>If you leave this page before submitting your form, the information will be lost.</p>\n    \n  '#format': full_html\npsrf_section_networkusername:\n  '#type': webform_section\n  '#title': 'Network User Name'\n  srf_networkusername:\n    '#type': textfield\n    '#title': 'Network User Name'\npsrf_section_contactinformation:\n  '#type': webform_section\n  '#title': 'Contact Information'\n  srf_name:\n    '#type': textfield\n    '#title': Name\n    '#required': true\n  srf_phone:\n    '#type': tel\n    '#title': Phone\n    '#telephone_validation_format': '2'\n    '#telephone_validation_country': CA\n    '#required': true\n  srf_email:\n    '#type': email\n    '#title': Email\n    '#required': true\n  srf_branch:\n    '#type': webform_term_select\n    '#title': Branch\n    '#required': true\n    '#vocabulary': branch\n    '#breadcrumb_delimiter': ''\npsrf_section_requestdetails:\n  '#type': webform_section\n  '#title': 'Request Details'\n  srf_isnewrequestorexistingproject:\n    '#type': select\n    '#title': 'Is this a new request or an update to an existing project?'\n    '#options':\n      News: News\n      Update: Update\n  rsf_projecttitle:\n    '#type': textfield\n    '#title': 'Project Title'\n    '#required': true\n  rsf_daterequired:\n    '#type': date\n    '#title': 'Date Required'\n    '#required': true\n    '#datepicker': true\n    '#datepicker_button': true\n  srf_isrequesttoscheduledevent:\n    '#type': select\n    '#title': 'Is the request tied to a scheduled event?'\n    '#options': yes_no\n    '#required': true\n  srf_departmentalpriority:\n    '#type': textfield\n    '#title': 'Please identify which departmental priority your publishing request supports'\n    '#required': true\n  srf_mainmessage:\n    '#type': textarea\n    '#title': 'What is the main message you wish to communicate?'\n    '#required': true\n  srf_targetaudience:\n    '#type': select\n    '#title': 'Target Audience'\n    '#options':\n      'AAFC Employees': 'AAFC Employees'\n      'Agri-Food Industry': 'Agri-Food Industry'\n      Consumers: Consumers\n      'Educational Institution': 'Educational Institution'\n      'General Public': 'General Public'\n      International: International\n      Media: Media\n      Producers: Producers\n      'Scientific Community': 'Scientific Community'\n      Youth: Youth\n    '#required': true\npsrf_section_productsrequired:\n  '#type': webform_section\n  '#title': 'Products Required'\n  srf_lbl_selectproducts:\n    '#type': label\n    '#title': 'Please select the products you require from the drop down menu. Press CTRL key while clicking to select multiple products.'\n  srf_product:\n    '#type': select\n    '#title': Product\n    '#multiple': true\n    '#options':\n      'AAFC# / ISBN # / ISSN #</': 'AAFC# / ISBN # / ISSN #</'\n      'Advertisement / Public Notice': 'Advertisement / Public Notice'\n      'Advice / Info / Inquiry': 'Advice / Info / Inquiry'\n      'Banner Stand': 'Banner Stand'\n      Binder: Binder\n      Book: Book\n      Booklet: Booklet\n      Calendar: Calendar\n      Certificate: Certificate\n      'Copyright Request': 'Copyright Request'\n      'Cover Page': 'Cover Page'\n      'Display Case': 'Display Case'\n      'Exhibit Display': 'Exhibit Display'\n      'Fact Sheet': 'Fact Sheet'\n      'Graphic Design': 'Graphic Design'\n      Guide: Guide\n      Handbook: Handbook\n      Illustration: Illustration\n      'Information Card': 'Information Card'\n      'Kit Folder': 'Kit Folder'\n      Map: Map\n      'Minister’s Message': 'Minister’s Message'\n      Newsletter: Newsletter\n      Pamphlet: Pamphlet\n      'Photo Research': 'Photo Research'\n      'Photography Services': 'Photography Services'\n      'Podium Sign': 'Podium Sign'\n      Poster: Poster\n      'Promotional Item': 'Promotional Item'\n      Report: Report\n      Signage: Signage\n      'Social Media': 'Social Media'\n      Template: Template\n      'Visual Identifier': 'Visual Identifier'\n      'Website Graphics': 'Website Graphics'\n    '#required': true\npsrf_section_additionalcomments:\n  '#type': webform_section\n  '#title': 'Additional Comments'\n  srf_addintionalcomments:\n    '#type': textarea\n    '#title': 'Please provide a brief description of the product(s) required including any additional information or special comments'\npsrf_section_content_approval:\n  '#type': webform_section\n  '#title': 'Content Approval'\n  srf_hascontentpproved:\n    '#type': select\n    '#title': 'Has the content been approved'\n    '#options':\n      'Yes': 'Yes'\n      'No': 'No'\n    '#required': true\n  srf_lbl_nameandtitle:\n    '#type': label\n    '#title': 'Please enter the name and title of the person who has approved the content:'\n    '#states':\n      visible:\n        ':input[name=\"srf_hascontentpproved\"]':\n          value: 'Yes'\n      invisible:\n        ':input[name=\"srf_hascontentpproved\"]':\n          '!value': 'Yes'\n  srf_approvername:\n    '#type': textfield\n    '#title': Name\n    '#required': true\n    '#states':\n      visible:\n        ':input[name=\"srf_hascontentpproved\"]':\n          value: 'Yes'\n      invisible:\n        ':input[name=\"srf_hascontentpproved\"]':\n          '!value': 'Yes'\n  srf_approvertitle:\n    '#type': textfield\n    '#title': Title\n    '#required': true\n    '#states':\n      visible:\n        ':input[name=\"srf_hascontentpproved\"]':\n          value: 'Yes'\n      invisible:\n        ':input[name=\"srf_hascontentpproved\"]':\n          '!value': 'Yes'\n  srf_contentfinalizedinenglishandfrench:\n    '#type': select\n    '#title': 'Has the content been finalized in both English and French?'\n    '#options': yes_no\n    '#required': true\npsrf_section_attachments:\n  '#type': webform_section\n  '#title': Attachments\n  psrf_details_attachallfiles:\n    '#type': details\n    '#title': 'Please attach all files required for this request:'\n    srf_attachedfiles:\n      '#type': managed_file\n      '#title': 'Attached Files'\n      '#multiple': 6\n  psrf_attachmentdescription:\n    '#type': processed_text\n    '#text': '<i>Attach English and French TXT, DOC, DOCX, WPD, HTML, PDF, XML, JPG, JPEG, GIF, BMP, CSS, ZIP, XLS, AVI, MPG, MPEG, PNG, PPT files related to this request. If more than 6 files need to be attached, please use a ZIP utility to archive them and then submit the ZIP file.</i>'\n    '#format': full_html\nactions:\n  '#type': webform_actions\n  '#title': 'Submit button(s)'\n  '#submit__label': Submit\n  '#reset__label': Reset\n  '#reset__attributes':\n    class:\n      - 'btn btn-primary'\npsrf_pagefootermessage:\n  '#type': processed_text\n  '#text': |\n    <main property=\"mainContentOfPage\" role=\"main\">\n      <section>\n        <p>Please note: Once this form is completed and received in the Publishing inbox, a project officer will contact you within two business days.\n        </p>\n      </section>\n    </main>\n    \n  '#format': full_html"
