      subject: 'Publishing Request Form/Formulaire de demande de publication'
      body: "<p>&nbsp;</p>\r\n\r\n<div class=\"dispaly_fr_hide_en\">\r\n<h1>Publishing and Creative Services Request Form</h1>\r\n</div>\r\n\r\n<div class=\"display_en_hide_fr\">\r\n<h1>Formulaire de demande des services de publication et de cr&eacute;ation</h1>\r\n</div>\r\n\r\n<div class=\"dispaly_fr_hide_en\"><strong>Thank you!</strong><br />\r\n<br />\r\nYour request to Publishing &amp; Creative Services has been received. A Project number will be provided to you shortly.<br />\r\n<br />\r\nIf you have not heard from us within one business day (sooner for an urgent request), please contact <a href=\"mailto: aafc.publishing-publications.aac@canada.ca\">Publishing and Creative Services</a>.<br />\r\nWe invite you to consult the <a href=\"/en/public-affairs-branch/marketing-and-publishing-services\">Marketing and Publishing Services</a> page for more information on our services and for general timelines.<br />\r\n<br />\r\n&nbsp;</div>\r\n\r\n<div class=\"display_en_hide_fr\"><strong>Merci !</strong><br />\r\n<br />\r\nLes Services de publication et de cr&eacute;ation ont bien re&ccedil;u votre demande. Nous vous communiquerons un num&eacute;ro de projet sous peu.<br />\r\n<br />\r\nSi nous n&#39;avons pas communiqu&eacute; avec vous d&#39;ici la fin de la prochaine journ&eacute;e ouvrable (ou plus t&ocirc;t si la demande est urgente), veuillez nous contacter &agrave; l&#39;adresse <a href=\"mailto: aafc.publishing-publications.aac@canada.ca\">communiquer avec nous</a>.<br />\r\nNous vous invitons &agrave; consulter la page <a href=\"/fr/direction-generale-des-affaires-publiques/services-de-marketing-et-dedition\">Services de marketing et d&#39;&eacute;dition</a> pour plus de renseignements sur nos services et sur les d&eacute;lais d&#39;ex&eacute;cution.<br />\r\n<br />\r\n&nbsp;</div>\r\n\r\n<div>\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Contact Information</h2>