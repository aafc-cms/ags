id: publishing_and_creative_services
title: 'Publishing and Creative Services Request Form'
description: "<p>The information provided below will help initiate your publishing project. Once submitted, Publishing and Creative Services will contact you within two business days.</p>\r\n\r\n<p>If you leave this page before submitting your form, the information will be lost.</p>"
category: 'Services Request Form'
elements: |-
  psrf_pagedescription:
    '#type': processed_text
    '#text': |
      <p>The information provided below will help initiate your publishing project. Once submitted, Publishing and Creative Services will contact you within two business days.</p>

      <p>If you leave this page before submitting your form, the information will be lost.</p>
    '#format': full_html
  psrf_section_networkusername:
    '#type': webform_section
    '#title': 'Network User Name'
    srf_networkusername:
      '#type': textfield
      '#title': 'Network User Name'
  psrf_section_contactinformation:
    '#type': webform_section
    '#title': 'Contact Information'
    srf_name:
      '#type': textfield
      '#title': Name
      '#required': true
    srf_phone:
      '#type': tel
      '#title': 'Phone number (+1613-555-5000)'
      '#required': true
      '#telephone_validation_format': '0'
      '#telephone_validation_country': CA
    srf_email:
      '#type': email
      '#title': Email
      '#required': true
    srf_branch:
      '#type': webform_term_select
      '#title': Branch
      '#required': true
      '#vocabulary': branch
      '#breadcrumb_delimiter': ''
  psrf_section_requestdetails:
    '#type': webform_section
    '#title': 'Request Details'
    srf_isnewrequestorexistingproject:
      '#type': select
      '#title': 'Is this a new request or an update to an existing project?'
      '#options':
        New: New
        Update: Update
      '#required': true
    is_your_project_submission_related_to_any_other_request_already_:
      '#type': select
      '#title': 'Is your project submission related to any other request already in production?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#required': true
    if_so_please_provide_the_project_number_:
      '#type': textfield
      '#title': 'If so please provide the project number'
      '#required': true
      '#states':
        visible:
          ':input[name="is_your_project_submission_related_to_any_other_request_already_"]':
            value: 'Yes'
    and_name_of_communications_advisor:
      '#type': textfield
      '#title': 'and name of communications advisor'
      '#states':
        visible:
          ':input[name="is_your_project_submission_related_to_any_other_request_already_"]':
            value: 'Yes'
      '#required': true
    rsf_projecttitle:
      '#type': textfield
      '#title': 'Project Title'
      '#required': true
    rsf_daterequired:
      '#type': date
      '#title': 'Date Required'
      '#required': true
      '#date_date_min': '+2 days'
      '#datepicker': true
      '#datepicker_button': true
    srf_isrequesttoscheduledevent:
      '#type': select
      '#title': 'Is the request tied to a scheduled event?'
      '#options': yes_no
      '#required': true
    srf_departmentalpriority:
      '#type': textfield
      '#title': 'Please identify which departmental priority your publishing request supports'
      '#required': true
    srf_mainmessage:
      '#type': textarea
      '#title': 'What is the main message you wish to communicate?'
      '#required': true
    srf_targetaudience:
      '#type': select
      '#title': 'Target Audience'
      '#options':
        'AAFC Employees': 'AAFC Employees'
        'Agri-Food Industry': 'Agri-Food Industry'
        Consumers: Consumers
        'Educational Institution': 'Educational Institution'
        'General Public': 'General Public'
        International: International
        Media: Media
        Producers: Producers
        'Scientific Community': 'Scientific Community'
        Youth: Youth
      '#sort_options': true
      '#required': true
    srf_hascommadvisorapproved:
      '#type': select
      '#title': 'Has your Communications Advisor approved this project?'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#required': true
  psrf_section_productsrequired:
    '#type': webform_section
    '#title': 'Products Required'
    srf_html_selectproducts:
      '#type': webform_markup
      '#display_on': both
      '#markup': 'Please select the products you require from the list below.'
    srf_product:
      '#type': checkboxes
      '#title': Product
      '#options':
        'AAFC# / ISBN # / ISSN #</': 'AAFC# / ISBN # / ISSN #</'
        'Advertisement / Public Notice': 'Advertisement / Public Notice'
        'Advice / Info / Inquiry': 'Advice / Info / Inquiry'
        'Banner Stand': 'Banner Stand'
        Binder: Binder
        Book: Book
        Booklet: Booklet
        'Cafeteria slide': 'Cafeteria slide'
        Calendar: Calendar
        Carousel: Carousel
        Certificate: Certificate
        'Copyright Request': 'Copyright Request'
        'Cover Page': 'Cover Page'
        'Display Case': 'Display Case'
        'Exhibit Display': 'Exhibit Display'
        'Fact Sheet': 'Fact Sheet'
        Guide: Guide
        Handbook: Handbook
        Illustration: Illustration
        Infographic: Infographic
        'Information Card': 'Information Card'
        'Kit Folder': 'Kit Folder'
        Lockscreen: Lockscreen
        Map: Map
        'Microsoft Teams background': 'Microsoft Teams background'
        'Minister’s Message': 'Minister’s Message'
        Newsletter: Newsletter
        Pamphlet: Pamphlet
        'Photo Research': 'Photo Research'
        'Photography Services': 'Photography Services'
        Placemat: Placemat
        'Podium Sign': 'Podium Sign'
        Poster: Poster
        'Promotional Item': 'Promotional Item'
        Report: Report
        Signage: Signage
        'Social Media': 'Social Media'
        Template: Template
        'Visual Identifier': 'Visual Identifier'
        'Website Graphics': 'Website Graphics'
      '#sort_options': true
      '#required': true
  psrf_section_additionalcomments:
    '#type': webform_section
    '#title': 'Additional Comments'
    srf_addintionalcomments:
      '#type': textarea
      '#title': 'Please provide a brief description of the product(s) required including any additional information or special comments'
  psrf_section_content_approval:
    '#type': webform_section
    '#title': 'Content Approval'
    srf_hascontentpproved:
      '#type': select
      '#title': 'Has the content been approved'
      '#options':
        'Yes': 'Yes'
        'No': 'No'
      '#required': true
    srf_html_approvernametitle:
      '#type': webform_markup
      '#states':
        visible:
          ':input[name="srf_hascontentpproved"]':
            value: 'Yes'
        invisible:
          ':input[name="srf_hascontentpproved"]':
            '!value': 'Yes'
      '#markup': 'Please enter the name and title of the person who has approved the content:'
    srf_approvername:
      '#type': textfield
      '#title': Name
      '#required': true
      '#states':
        visible:
          ':input[name="srf_hascontentpproved"]':
            value: 'Yes'
        invisible:
          ':input[name="srf_hascontentpproved"]':
            '!value': 'Yes'
    srf_approvertitle:
      '#type': textfield
      '#title': Title
      '#required': true
      '#states':
        visible:
          ':input[name="srf_hascontentpproved"]':
            value: 'Yes'
        invisible:
          ':input[name="srf_hascontentpproved"]':
            '!value': 'Yes'
    srf_contentfinalizedinenglishandfrench:
      '#type': select
      '#title': 'Has the content been finalized in both English and French?'
      '#options': yes_no
      '#required': true
    level_of_approval_required:
      '#type': select
      '#title': 'Level of approval required'
      '#options':
        Director: Director
        DG: DG
        ADM: ADM
        DM: DM
        MINO: MINO
      '#required': true
  attach_communication_plan:
    '#type': webform_section
    '#title': 'Please attach any supporting documentation including your approved communications plan, existing visuals and background information:'
    psrf_section_attachments:
      '#type': details
      '#title': Attachments
      '#open': true
      psrf_details_attachallfiles:
        '#type': details
        '#title': 'Please attach all files required for this request:'
        srf_attachedfiles:
          '#type': managed_file
          '#title': 'Attached Files'
          '#multiple': 6
          '#uri_scheme': public
      psrf_attachmentdescription:
        '#type': processed_text
        '#text': '<i>Attach English and French TXT, DOC, DOCX, WPD, HTML, PDF, XML, JPG, JPEG, GIF, BMP, CSS, ZIP, XLS, AVI, MPG, MPEG, PNG, PPT files related to this request. If more than 6 files need to be attached, please use a ZIP utility to archive them and then submit the ZIP file.</i>'
        '#format': full_html
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Submit
    '#reset__label': Reset
    '#reset__attributes':
      class:
        - ''
  psrf_pagefootermessage:
    '#type': processed_text
    '#text': |
      <p>Please note: Once this form is completed and received in the Publishing inbox, a project officer will contact you within two business days.
       </p>
        
    '#format': full_html
