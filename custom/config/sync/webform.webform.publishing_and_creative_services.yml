      subject: 'Publishing Request Form/Formulaire de demande de publication'
      body: "<p>&nbsp;</p>\r\n\r\n<div class=\"dispaly_fr_hide_en\">\r\n<h1>Publishing and Creative Services Request Form</h1>\r\n</div>\r\n\r\n<div class=\"display_en_hide_fr\">\r\n<h1>Formulaire de demande des services de publication et de cr&eacute;ation</h1>\r\n</div>\r\n\r\n<div class=\"dispaly_fr_hide_en\"><strong>Thank you!</strong><br />\r\n<br />\r\nYour request to Publishing &amp; Creative Services has been received. A Project number will be provided to you shortly.<br />\r\n<br />\r\nIf you have not heard from us within one business day (sooner for an urgent request), please contact <a href=\"mailto: aafc.publishing-publications.aac@canada.ca\">Publishing and Creative Services</a>.<br />\r\nWe invite you to consult the <a href=\"/en/public-affairs-branch/marketing-and-publishing-services\">Marketing and Publishing Services</a> page for more information on our services and for general timelines.<br />\r\n<br />\r\n&nbsp;</div>\r\n\r\n<div class=\"display_en_hide_fr\"><strong>Merci !</strong><br />\r\n<br />\r\nLes Services de publication et de cr&eacute;ation ont bien re&ccedil;u votre demande. Nous vous communiquerons un num&eacute;ro de projet sous peu.<br />\r\n<br />\r\nSi nous n&#39;avons pas communiqu&eacute; avec vous d&#39;ici la fin de la prochaine journ&eacute;e ouvrable (ou plus t&ocirc;t si la demande est urgente), veuillez nous contacter &agrave; l&#39;adresse <a href=\"mailto: aafc.publishing-publications.aac@canada.ca\">communiquer avec nous</a>.<br />\r\nNous vous invitons &agrave; consulter la page <a href=\"/fr/direction-generale-des-affaires-publiques/services-de-marketing-et-dedition\">Services de marketing et d&#39;&eacute;dition</a> pour plus de renseignements sur nos services et sur les d&eacute;lais d&#39;ex&eacute;cution.<br />\r\n<br />\r\n&nbsp;</div>\r\n\r\n<div>\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Contact Information</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td colspan=\"2\">\r\n\t\t\t<h2 class=\"display_en_hide_fr\">Coordonn&eacute;es de la personne-ressource</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"height:10px\">&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Name</strong></span> <span class=\"display_en_hide_fr\"><strong>Nom</strong></span></td>\r\n\t\t\t<td>[webform_submission:values:srf_name]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Phone</strong></span> <span class=\"display_en_hide_fr\"><strong>T&eacute;l&eacute;phone</strong></span></td>\r\n\t\t\t<td>[webform_submission:values:srf_phone]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Email</strong></span> <span class=\"display_en_hide_fr\"><strong>Courriel</strong></span></td>\r\n\t\t\t<td>[webform_submission:values:srf_email]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Branch</strong></span> <span class=\"display_en_hide_fr\"><strong>Direction g&eacute;n&eacute;rale</strong></span></td>\r\n\t\t\t<td>[webform_submission:values:srf_branch]</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</div>\r\n\r\n<div style=\"height: 25px;\">&nbsp;</div>\r\n\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Request Details</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"display_en_hide_fr\">D&eacute;tails sur la demande</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"height:10px\">&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Is this a new request or an update to an existing project?</strong></span> <span class=\"display_en_hide_fr\"><strong>S&rsquo;agit-il d&rsquo;une nouvelle demande ou d&rsquo;une mise &agrave; jour d&rsquo;un projet existant?</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_isnewrequestorexistingproject]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Project Title</strong></span> <span class=\"display_en_hide_fr\"><strong>Num&eacute;ro du projet</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:rsf_projecttitle]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Date Required</strong></span> <span class=\"display_en_hide_fr\"><strong>Titre du projet</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:rsf_daterequired]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Is the request tied to a scheduled event?</strong></span> <span class=\"display_en_hide_fr\">Cette demande est-elle li&eacute;e &agrave; une activit&eacute; planifi&eacute;e?</span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_isrequesttoscheduledevent]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Please identify which departmental priority your publishing request supports</strong></span> <span class=\"display_en_hide_fr\">Veuillez indiquer quellest la priorit&eacute; minist&eacute;rielle qu&rsquo;appuie votre demande de publication</span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_departmentalpriority]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>What is the main message you wish to communicate?</strong></span> <span class=\"display_en_hide_fr\"><strong>Quel est le message principal que vous souhaitez communiquer?</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_mainmessage]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Target Audience</strong></span> <span class=\"display_en_hide_fr\"><strong>Public cible</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_targetaudience]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Has your Communications Advisor approved this project?</strong></span> <span class=\"display_en_hide_fr\"><strong>Has your Communications Advisor approved this project?/Votre conseiller en communication a-t-il approuv&eacute; ce projet?</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_hascommadvisorapproved]</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</div>\r\n\r\n<div style=\"height: 25px;\">&nbsp;</div>\r\n\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Products Required</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"display_en_hide_fr\">Produits demand&eacute;s</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"height:10px\">&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Please select the products you require from the drop down menu. Press CTRL key while clicking to select multiple products.</strong></span> <span class=\"display_en_hide_fr\"><strong>Veuillez s&eacute;lectionner les produits dont vous avez besoin dans le menu d&eacute;roulant. Pour s&eacute;lectionner plusieurs produits, gardez la touche CTRL enfonc&eacute;e en cliquant.</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Project</strong></span> <span class=\"display_en_hide_fr\"><strong>Produit</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_product]</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</div>\r\n\r\n<div>&nbsp;</div>\r\n\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Additional Comments</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"display_en_hide_fr\">Commentaires additionnels</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"height:10px\">&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Please provide a brief description of the product(s) required including any additional information or special comments</strong></span> <span class=\"display_en_hide_fr\"><strong>Veuillez fournir une br&egrave;ve description du produit demand&eacute;, y compris toute information suppl&eacute;mentaire ou observation particuli&egrave;re</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_addintionalcomments]</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</div>\r\n\r\n<div>&nbsp;</div>\r\n\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Content Approval</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"display_en_hide_fr\">Approbation du contenu</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"height:10px\">&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Has the content been approved?</strong></span> <span class=\"display_en_hide_fr\"><strong>Le contenu a-t-il &eacute;t&eacute; approuv&eacute; ?</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_hascontentpproved]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Please enter the name and title of the person who has approved the content:</strong></span> <span class=\"display_en_hide_fr\"><strong>Veuillez indiquer le nom et le titre de la personne qui a approuv&eacute; le contenu&nbsp;:</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Name</strong></span> <span class=\"display_en_hide_fr\"><strong>Nom</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_approvername]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Title</strong></span> <span class=\"display_en_hide_fr\"><strong>Titre</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>[webform_submission:values:srf_approvertitle]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Has the content been finalized in both English and French?</strong></span> <span class=\"display_en_hide_fr\"><strong>Le contenu est-il final en anglais et en fran&ccedil;ais?</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_contentfinalizedinenglishandfrench]</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</div>\r\n\r\n<div style=\"height: 25px;\">&nbsp;</div>\r\n\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Please attach any supporting documentation including your approved communications plan, existing visuals and background information:</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"display_en_hide_fr\">Veuillez joindre toute documentation à l'appui de votre demande, y compris votre plan de communication approuvé, des visuels et toutes informations offrants du contexte:</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Attachments</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"display_en_hide_fr\">Pi&egrave;ces jointes</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"height:10px\">&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Please attach all files required for this request:</strong></span> <span class=\"display_en_hide_fr\"><strong>Veuillez joindre tous les fichiers requis pour cette demande:</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Attached Files</strong></span> <span class=\"display_en_hide_fr\"><strong>Fichiers joints</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>\r\n\t\t\t<div>[webform_submission:values:srf_attachedfiles:clear]</div>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</div>\r\n</div>"
