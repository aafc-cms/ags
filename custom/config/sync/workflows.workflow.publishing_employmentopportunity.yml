      from:
        - archived_emplstate
      to: draft
      weight: 3
    save_as_a_draft_empltrans:
      label: 'Save as a draft'
      from:
        - draft
        - emergency_publish_emplstate
        - published
      to: draft
      weight: 1
    send_for_deletion_empltrans:
      label: 'Send for deletion'
      from:
        - archived_emplstate
      to: delete_emplstate
      weight: 2
    send_to_reviewer_empltrans:
