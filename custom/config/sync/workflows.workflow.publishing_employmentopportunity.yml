id: publishing_employmentopportunity
label: Publishing_EmploymentOpportunity
type: content_moderation
type_settings:
  states:
    archived_emplstate:
      published: false
      default_revision: true
      label: Archived
      weight: 3
    delete_emplstate:
      published: false
      default_revision: true
      label: Delete
      weight: 1
    draft:
      label: Draft
      published: false
      default_revision: false
      weight: -2
    emergency_publish_emplstate:
      published: true
      default_revision: true
      label: 'Emergency Publish'
      weight: 2
    published:
      label: Published
      published: true
      default_revision: true
      weight: 0
    send_to_review_emplstate:
      published: false
      default_revision: false
      label: 'Send to review'
      weight: -1
  transitions:
    delete_empltrans:
      label: Delete
      from:
        - delete_emplstate
        - draft
        - emergency_publish_emplstate
        - published
      to: archived_emplstate
      weight: 5
    emergency_publish_empltrans:
      label: 'Emergency publish'
      from:
        - draft
        - emergency_publish_emplstate
        - published
      to: emergency_publish_emplstate
      weight: 4
    publish:
      label: Publish
      to: published
      weight: 0
