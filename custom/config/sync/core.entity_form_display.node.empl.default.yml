    group_opportunitydescription:
      children:
        - body
      parent_name: ''
      weight: 2
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">\r\n Please include the information identified below in the opportunity description. This information must be included in your employment opportunity poster. If you have not yet created your poster, please complete in consultation with your\r\n<a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=1548432&amp;lang=eng\">Human Resources Advisor</a>\r\n, Staffing, the <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2879035&amp;lang=eng\">AAFC Employment Opportunity Poster Template</a>.\r\n</span>\r\n<ul class=\"english-only\">\t\r\n\t<li>Duties <strong>(if applicable)</strong></li>\t\r\n\t<li>Statement of Merit Criteria<strong>(required)</strong>\t\t\r\n\t\t\t<ul>\t\t\t\r\n\t\t\t<li>Essential Qualifications (i.e.: education, experience, knowledge, competencies) <strong>(required)</strong></li>\t\t\t\r\n\t\t\t<li>Language Requirement(s) <strong>(required)</strong></li>\t\t\r\n\t\t\t</ul>\t\r\n\t</li>\t\r\n\t<li>Asset Qualifications (i.e.: education, experience, knowledge, competencies) <strong>(optional)</strong></li>\t\r\n\t<li>Organizational Needs <strong>(required)</strong></li>\t\r\n\t<li>Conditions of Employment <strong>(required)</strong>\r\n\t\t<ul>\t\t\r\n\t\t<li>Security Requirement(s) <strong>(required)</strong></li>\t\t\r\n\t\t<li>Other conditions of employment (i.e.: travel and/or overtime) <strong>(optional)</strong></li>\t\r\n\t\t</ul>\r\n\t </li>\r\n\t<li>Applications<strong>(required)</strong></li>\t\r\n\t<li>Notes <strong>(required)</strong></li>\r\n</ul>\r\n\r\n\r\n<span class=\"french-only\">\r\nVeuillez inclure les renseignements indiqués ci-dessous dans la description de la possibilité. Ces renseignements doivent être inclus dans votre affiche annonçant la possibilité d'emploi. Si vous n'avez pas encore créé votre affiche, veuillez remplir, en consultation avec votre\r\n<a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=1548432&amp;lang=fra\">conseiller en ressources humaines</a>\r\nresponsable de la dotation, le modèle\r\n<a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2917181&amp;lang=fra\">d'affiche pour les possibilités d'emploi à AAC</a>.\r\n</span>\r\n<ul class=\"french-only\">\t\r\n\t<li>Fonctions <strong>(le cas échéant)</strong></li>\t\r\n\t<li>Énoncer des critères de mérite <strong>(requis)</strong>\t\t\r\n\t\t<ul>\t\t\t\r\n\t\t\t<li>Qualifications essentielles (exemples: éducation, expérience, connaissance, compétences) <strong>(requis)</strong></li>\t\t\t\r\n\t\t\t<li>Exigence(s) linguistique(s) <strong>(requis)</strong></li>\t\t\r\n\t\t</ul>\t\r\n\t</li>\t\r\n\t<li>Qualifications constituant un atout (exemples: éducation, expérience, connaissance, compétences) <strong>(optionnelle)</strong></li>\t\r\n\t<li>Besoins de l'organisation <strong>(requis)</strong></li>\t\r\n\t<li>Conditions d'emploi <strong>(requis)</strong>\t\t\r\n\t\t<ul>\t\t\t\r\n\t\t<li>Exigence(s) de sécurité(s) <strong>(requis)</strong></li>\t\t\t\r\n\t\t<li>Autre(s) conditions d'emploi(s) (exemples: voyager et/ou heures supplémentaires) <strong>(optionnelle)</strong></li>\t\t\r\n\t\t</ul>\t\r\n\t</li>\t\r\n\t<li>Demandes <strong>(requis)</strong></li>\t\r\n\t<li>Remarques <strong>(requis)</strong></li>\r\n</ul>\r\n"
