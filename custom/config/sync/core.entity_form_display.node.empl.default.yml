      format_settings:
        classes: never-collapse
        show_empty_fields: false
        id: ''
        open: true
        description: "<span class=\"english-only\">\r\n Please include the information identified below in the opportunity description. This information must be included in your employment opportunity poster. If you have not yet created your poster, please complete in consultation with your\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"c961fe54-9dc5-49aa-b5a2-fa072799023d\" href=\"/node/2187\">Human Resources Advisor</a>\r\n, Staffing, the <a data-entity-substitution=\"file\" data-entity-type=\"file\" data-entity-uuid=\"90f9ae0c-9c69-49db-9b57-6b85dad28c6b\" href=\"/sites/default/files/documents/2023-02/Internal_employment_opportunity_poster_template-en-fr.docx\">Internal Employment Opportunity Poster Template (Word)</a>.\r\n</span>\r\n<br><ul class=\"english-only\">\t\r\n\t<li>Job Summary and Duties <strong>(required)</strong></li>\r\n\t<li>Job Requirements <strong>(required)</strong></li>\r\n\t<li>Organizational Needs <strong>(required)</strong></li>\t\r\n\t<li>Conditions of Employment <strong>(required)</strong>\r\n\t\t<ul>\t\t\r\n\t\t<li>Security Requirement(s) <strong>(required)</strong></li>\t\t\r\n\t\t<li>Other conditions of employment (examples: travel and/or overtime) <strong>(optional)</strong></li>\t\r\n\t\t</ul>\r\n\t </li>\r\n\t<li>Applications<strong>(required)</strong></li>\t\r\n\t<li>Notes <strong>(required)</strong></li>\r\n</ul>\r\n\r\n\r\n<span class=\"french-only\">\r\nVeuillez inclure les renseignements indiqués ci-dessous dans la description de la possibilité. Ces renseignements doivent être inclus dans votre affiche annonçant la possibilité d'emploi. Si vous n'avez pas encore créé votre affiche, veuillez remplir, en consultation avec votre\r\n<a data-entity-substitution=\"canonical\" data-entity-type=\"node\" data-entity-uuid=\"c961fe54-9dc5-49aa-b5a2-fa072799023d\" href=\"/node/2187\">conseiller en ressources humaines</a>\r\nresponsable de la dotation, le modèle\r\n<a data-entity-substitution=\"file\" data-entity-type=\"file\" data-entity-uuid=\"90f9ae0c-9c69-49db-9b57-6b85dad28c6b\" href=\"/sites/default/files/documents/2023-02/Internal_employment_opportunity_poster_template-en-fr.docx\">le modèle d'annonce d'occasion d'emploi à l'interne (Word)</a>.\r\n</span><br>\r\n<ul class=\"french-only\">\t\r\n\t<li>Résumé du poste et tâches <strong>(requis)</strong></li>\t\r\n\t<li>Exigences du poste <strong>(requis)</strong></li>\t\r\n\t<li>Besoins de l'organisation <strong>(requis)</strong></li>\t\r\n\t<li>Conditions d'emploi <strong>(requis)</strong>\t\t\r\n\t\t<ul>\t\t\t\r\n\t\t<li>Exigence(s) de sécurité(s) <strong>(requis)</strong></li>\t\t\t\r\n\t\t<li>Autre(s) conditions d'emploi(s) (exemples: voyager et/ou heures supplémentaires) <strong>(optionnelle)</strong></li>\t\t\r\n\t\t</ul>\t\r\n\t</li>\t\r\n\t<li>Demandes <strong>(requis)</strong></li>\t\r\n\t<li>Remarques <strong>(requis)</strong></li>\r\n</ul>\r\n"
