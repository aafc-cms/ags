id: video_production_request_form
title: 'Video Production Request Form'
description: ''
category: 'Services Request Form'
elements: |-
  psrf_pagedescription:
    '#type': processed_text
    '#format': full_html
  requestername:
    '#type': textfield
    '#title': 'Requester’s Name'
    '#required': true
  telephone:
    '#type': tel
    '#title': Telephone
    '#placeholder': +1613-555-5000
    '#required': true
    '#telephone_validation_format': '2'
    '#telephone_validation_country': CA
  email:
    '#type': email
    '#title': Email
    '#required': true
  branch:
    '#type': select
    '#title': Branch
    '#options':
      'Canada Agricultural Review Tribunal': 'Canada Agricultural Review Tribunal'
      'Canadian Dairy Commission': 'Canadian Dairy Commission'
      'Canadian Grain Commission': 'Canadian Grain Commission'
      'Farm Credit Canada': 'Farm Credit Canada'
      'Corporate Management Branch': 'Corporate Management Branch'
      'Deputy Ministers'' Office': 'Deputy Ministers'' Office'
      'Farm Products Council of Canada': 'Farm Products Council of Canada'
      'Human Resources Branch': 'Human Resources Branch'
      'Information Systems Branch': 'Information Systems Branch'
      'International Affairs Branch': 'International Affairs Branch'
      'Legal Services': 'Legal Services'
      'Market and Industry Services Branch': 'Market and Industry Services Branch'
      'Office of Audit and Evaluation': 'Office of Audit and Evaluation'
      'Programs Branch': 'Programs Branch'
      'Public Affairs Branch': 'Public Affairs Branch'
      'Research Branch': 'Research Branch'
      'Science and Technology Branch': 'Science and Technology Branch'
      'Strategic Policy Branch': 'Strategic Policy Branch'
    '#sort_options': true
    '#required': true
  new_requestorupdateexisting_project_:
    '#type': radios
    '#title': 'Is this a new request or an update to an existing project?'
    '#options':
      New: New
      Update: Update
    '#required': true
  namedirectorlevelorabovewhowasconsulte:
    '#type': textfield
    '#title': 'Please provide the name (Director level or above) who was consulted, or who requested this project.'
    '#required': true
  nameofcommunicationsadvisor:
    '#type': textfield
    '#title': 'Please provide the name of the Communications Advisor (from Public Affairs Branch) who was consulted for this project?'
    '#required': true
  projectworkingtitle:
    '#type': textfield
    '#title': 'Project working title'
    '#required': true
  duedate:
    '#type': date
    '#title': 'Due date'
    '#required': true
    '#date_date_min': '+1 days'
    '#datepicker': true
    '#datepicker_button': true
  isvideoforevent:
    '#type': radios
    '#title': 'Is the video for an event? '
    '#options':
      'Yes': 'Yes'
      'No': 'No'
    '#required': true
  eventdate:
    '#type': date
    '#title': 'Event date'
    '#states':
      visible:
        ':input[name="isvideoforevent"]':
          value: 'Yes'
      required:
        ':input[name="isvideoforevent"]':
          value: 'Yes'
    '#date_date_min': '+1 days'
    '#datepicker': true
    '#datepicker_button': true
  targetaudience:
    '#type': checkboxes
    '#title': 'Target audience'
    '#options':
      'AAFC Employees': 'AAFC Employees'
      'Agricultural Producers': 'Agricultural Producers'
      Associations: Associations
      'Educational Institutions': 'Educational Institutions'
      'Food Exporters': 'Food Exporters'
      'Food Processors': 'Food Processors'
      'Foreign Businesses': 'Foreign Businesses'
      'Foreign Officials': 'Foreign Officials'
      'General Public - Canada': 'General Public - Canada'
      'General Public - International': 'General Public - International'
      Media: Media
      'Public Servants (other government departments)': 'Public Servants (other government departments)'
      'Scientific Community': 'Scientific Community'
      Youth: Youth
    '#options_all': true
    '#required': true
  othertargetaudience:
    '#type': textfield
    '#title': 'Other Target audience'
  publishingchannels:
    '#type': checkboxes
    '#title': 'Publishing channels'
    '#options':
      'AAFC Online': 'AAFC Online'
      AgriSource: AgriSource
      'YouTube public': 'YouTube public'
      'YouTube private': 'YouTube private'
      Facebook: Facebook
      Twitter: Twitter
      LinkedIn: LinkedIn
      'Event or Trade Show': 'Event or Trade Show'
      'Don’t know – requesting consultation': 'Don’t know – requesting consultation'
    '#options_all': true
    '#required': true
  otherpublishingchannel:
    '#type': textfield
    '#title': 'Other Publishing Channel'
  purpose:
    '#type': textarea
    '#title': Purpose
    '#required': true
  keymessages:
    '#type': textarea
    '#title': 'Key messages'
  calltoaction:
    '#type': textarea
    '#title': 'Call to action'
  description:
    '#type': textarea
    '#title': Description
    '#required': true
  additionallanguagesrequired:
    '#type': textarea
    '#title': 'Additional language(s) required'
    '#required': true
  pidentifydepartmentalpriority:
    '#type': textarea
    '#title': 'Please identify which departmental priority your publishing request supports.'
    '#required': true
  detailsofanyrelatedproducts:
    '#type': textarea
    '#title': 'Please provide details of any related products such as graphics, speeches, reports.'
  attachmentdescription:
    '#type': webform_markup
    '#display_on': both
    '#markup': '<strong>Please attach any supporting documentation including your approved communications plan, existing design elements and background information.</strong>'
  attachments:
    '#type': managed_file
    '#title': Attachments
    '#multiple': 7
    '#uri_scheme': public
  readvideoproductionservicestandards:
    '#type': checkbox
    '#title': 'I have read the Video Production Service Standards.'
    '#title_display': inline
    '#required': true
