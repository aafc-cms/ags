id: block_publishing
label: 'Block Publishing'
type: content_moderation
type_settings:
  states:
    archived:
      published: false
      default_revision: true
      label: Archived
      weight: 0
    delete:
      published: false
      default_revision: false
      label: Delete
      weight: 1
    draft:
      label: Draft
      published: false
      default_revision: false
      weight: -3
    published:
      label: Published
      published: true
      default_revision: true
      weight: -1
    review:
      published: false
      default_revision: false
      label: Review
      weight: -2
  transitions:
    approve_deletion:
