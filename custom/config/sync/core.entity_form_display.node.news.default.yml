third_party_settings:
  field_group:
    group_submitter_s_contact_inform:
      children:
        - field_newssubmittername
        - field_newssubmitteremail
        - field_newssubmitterphone
      parent_name: ''
      weight: 9
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">This person will be contacted if there are questions about this submission.</span>\r\n\r\n<span class=\"french-only\">\r\nLe coordonnateur de <em>nouvelles@l’ouvrage</em> communiquera avec cette personne s’il y a des questions au sujet de  l’article soumis.\r\n</span>"
        open: true
        required_fields: true
        id: ''
        classes: 'submitterContactDetail never-collapse'
      label: 'Submitter''s contact information'
    group_newsreviewerandapprover:
      children:
        - field_newsreviewedby
        - field_newsapprovedby
      parent_name: ''
      weight: 0
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">All articles must be reviewed by a <a href=\"/en/public-affairs-branch/communications-advisors\" target=\"_blank\">Public Affairs Branch Advisor</a> and be approved by a Director or above.</span>\r\n<span class=\"french-only\">Les articles doivent avoir l'approbation par un <a href=\"/fr/direction-generale-des-affaires-publiques/conseillers-en-communications\" target=\"_blank\">Conseiller d'Affaires Publique</a> et approver par un directeur ou a le conseiller d'affaires publiques.</span>"
        open: true
        required_fields: true
        id: ''
        classes: never-collapse
      label: 'Article approval'
    group_aboutarticle:
      children:
        - field_newstype
        - field_to
      parent_name: ''
      weight: 1
      format_type: details
      region: content
      format_settings:
        description: ''
        open: true
        required_fields: true
        id: ''
        classes: never-collapse
      label: 'About the article'
    group_newsarticleheadline:
      children:
        - title
      parent_name: ''
      weight: 2
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">See the <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2903350&amp;lang=eng\" target=\"_blank\">headline guidelines</a> for information on how to write an effective headline.\r\n</span>\r\n<span class=\"french-only\">\r\nVeuillez consulter les <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2911217&amp;lang=fra\" target=\"_blank\">instructions sur les titres</a> pour obtenir des conseils sur la rédaction de titres efficaces.\r\n</span>"
        open: true
        required_fields: true
        id: ''
        classes: ''
      label: 'Article headline'
    group_newssentby:
      children:
        - field_from
      parent_name: ''
      weight: 3
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">Name the branch, ADM, directorate, unit, or group that readers will see the article has been \"Sent By\". Consult the <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2903361&amp;lang=eng\" target=\"_blank\">Sent By guidelines</a>.</span>\r\n\r\n<span class=\"french-only\">Veuillez indiquer le nom de la direction générale, du ou de la SMA, de la direction, de la section ou du groupe que les lecteurs verront sous la mention « De ». Consultez les <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2911213&amp;lang=fra\" target=\"_blank\">instructions sur la mention « De »</a>.\r\n</span>"
        open: true
        required_fields: true
        id: ''
        classes: never-collapse
      label: 'Who will readers see the article has been "Sent By"?'
    group_newsarticle:
      children:
        - body
      parent_name: ''
      weight: 4
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">\r\nPaste the body of  the article below (do not include the headline). Indicate where any images (including captions) should appear.\r\n\r\nAny images, PDFs or other related files must be attached in the \"Related files\" section below. Review the instructions for  <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2903304&amp;lang=eng\" target=\"_blank\">photos, graphics, captions and permissions</a>.</span>\r\n\r\n<span class=\"french-only\">\r\nVeuillez copier/coller l’article dans l’espace ci-dessous (ne pas inclure le titre). Si  l’article contient des images, indiquez à quel endroit ces dernières et les légendes qui les accompagnent doivent être insérées dans l’article.\r\n\r\nLes images, les fichiers en format PDF et autres fichiers connexes doivent être joints  dans la section « Fichiers connexes » ci-dessous. Consultez les <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2911233&amp;lang=fra\" target=\"_blank\">instructions sur les photos, les graphiques, les légendes et les autorisations</a>.</span>"
        open: true
        required_fields: true
        id: ''
        classes: ''
      label: 'The article'
    group_newstranslationreqnum:
      children:
        - field_newstranslationnum
      parent_name: ''
      weight: 6
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">Please supply the request number given to you by <a href=\"/en/public-affairs-branch/translation-and-revision-services\" target=\"_blank\">Translation and Revision Services</a>. </span>\r\n\r\n<span class=\"french-only\">Veuillez fournir le  numéro de demande qui vous a été fourni par le <a href=\"/fr/direction-generale-des-affaires-publiques/service-de-traduction-et-de-revision\" target=\"_blank\">Service de traduction et de révision</a>.  </span>"
        open: true
        required_fields: true
        id: ''
        classes: never-collapse
      label: 'Translation request number'
    group_newsposteddate:
      children:
        - field_posted
      parent_name: ''
      weight: 7
      format_type: details
      region: content
      format_settings:
        description: ''
        open: true
        required_fields: true
        id: ''
        classes: never-collapse
      label: 'Posting date'
    group_newsnotes:
      children:
        - field_newsnotes
      parent_name: ''
      weight: 10
      format_type: details
      region: content
      format_settings:
        description: ''
        open: true
        required_fields: true
        id: ''
        classes: never-collapse
      label: Notes
    group_newsattachedfiles:
      children:
        - field_newsfile5
      parent_name: ''
      weight: 5
      format_type: details
      region: content
      format_settings:
        description: "<span class=\"english-only\">Click \"Add media\" to add any photos, graphics, PDFs or other  related files to the article. Review the instructions for <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2903304&amp;lang=eng\" target=\"_blank\">photos, graphics, captions and permissions</a>.</span>\r\n\r\n<span class=\"french-only\">\r\nSi l’article contient des photos, des graphiques, un  fichier en format PDF ou tout autre fichier connexe, cliquez sur « Joindre des médias» pour ajouter ces documents. Consultez les <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=2911233&amp;lang=fra\" target=\"_blank\">instructions sur photos, les graphiques, les légendes et les autorisations</a>.\r\n</span>"
        open: true
        required_fields: true
        id: ''
        classes: never-collapse
      label: 'Related files'
    group_testingdetailsgroup:
      children:
        - field_description
        - field_keywords
        - field_created_by
        - field_dc_date_created
        - field_issued
        - field_modified
      parent_name: ''
      weight: 13
      format_type: details_sidebar
      region: content
      format_settings:
        description: ''
        weight: -50
        required_fields: true
        id: ''
        classes: ''
        open: false
      label: 'aafc metadata group'
    group_newsaafcdectermstype:
      children:
        - field_meta_type
      parent_name: ''
      weight: 14
      format_type: details_sidebar
      region: content
      format_settings:
        id: ''
        classes: ''
        description: ''
        open: false
        required_fields: true
        weight: -44
      label: aafc-dcterms-gctype
    group_newsaafcdctermssubject:
