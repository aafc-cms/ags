third_party_settings:
  field_group:
    group_submitter_s_contact_inform:
      children:
        - field_newssubmittername
        - field_newssubmitteremail
        - field_newssubmitterphone
      label: "Submitter's contact information"
      region: content
      parent_name: ''
      weight: 0
      format_type: details
      format_settings:
        classes: 'submitterContactDetail never-collapse'
        show_empty_fields: false
        id: ''
        open: true
        description: "<span class=\"english-only\">This person will be contacted if there are questions about this submission.</span>\r\n\r\n<span class=\"french-only\">Cette personne sera contactée s’il y a des questions au sujet de l’article soumis.</span>"
        required_fields: true
    group_newsreviewerandapprover:
      children:
        - field_newsreviewedby
        - field_newsapprovedby
      label: 'Approval information'
      region: content
      parent_name: ''
      weight: 1
      format_type: details
      format_settings:
        classes: never-collapse
        id: ''
        open: true
        description: "<span class=\"english-only\">All articles must be reviewed by a <a href=\"/en/branches-and-offices/public-affairs-branch/communications-advisors\" target=\"_blank\">Communications Advisor</a> and be approved by a Director or above.</span>\r\n<span class=\"french-only\">Les articles doivent avoir l'approbation d’un <a href=\"/fr/directions-generales-et-bureaux/direction-generale-des-affaires-publiques/conseillers-en-communications\" target=\"_blank\">Conseiller/e en communications</a> et approuver par un directeur ou par le conseiller/e d'affaires publiques.</span>"
        required_fields: true
    group_aboutarticle:
      children:
        - field_newstype
        - field_to
      label: 'About the article'
      region: content
      parent_name: ''
      weight: 3
      format_type: details
      format_settings:
        classes: never-collapse
        id: ''
        open: true
        description: ''
        required_fields: true
    group_newsarticleheadline:
      children:
        - title
      label: 'Article headline'
      region: content
      parent_name: ''
      weight: 6
      format_type: details
      format_settings:
        classes: ''
        show_empty_fields: false
        id: ''
        open: true
        description: "<span class=\"english-only\">See the <a href=\"/en/news/newswork/how-submit-newswork-article#a4\" target=\"_blank\">headline guidelines</a> for tips on how to write an effective headline.\r\n</span>\r\n<span class=\"french-only\">\r\nVeuillez consulter les <a href=\"/fr/nouvelles/newswork/comment-soumettre-article-pour-nouvelleslouvrage#a4\" target=\"_blank\">instructions sur les titres</a> pour obtenir des conseils sur la rédaction de titres efficaces.\r\n</span>"
        required_fields: true
    group_newssentby:
      children:
        - field_from
      label: 'Sent by'
      region: content
      parent_name: ''
      weight: 5
      format_type: details
      format_settings:
        classes: never-collapse
        show_empty_fields: false
        id: ''
        open: true
        description: "<span class=\"english-only\">Name the branch, ADM, directorate, unit, or group that readers will see the article has been \"Sent By\". Consult the <a href=\"/en/news/newswork/how-submit-newswork-article#a5\" target=\"_blank\">Sent by guidelines</a>.</span>\r\n\r\n<span class=\"french-only\">Veuillez indiquer le nom de la direction générale, du ou de la SMA, de la direction, de la section ou du groupe que les lecteurs verront sous la mention « De ». Consultez <a href=\"/fr/nouvelles/newswork/comment-soumettre-article-pour-nouvelleslouvrage#a5\" target=\"_blank\">les instructions sur la mention « De »</a>.\r\n</span>"
        required_fields: true
    group_newsarticle:
      children:
        - body
      label: 'The article'
      region: content
      parent_name: ''
      weight: 7
      format_type: details
      format_settings:
        classes: ''
        show_empty_fields: false
        id: ''
        open: true
        description: "<span class=\"english-only\">\r\nPaste the body of  the article below (do not include the headline). Indicate where any images should appear. The images must be attached in the \"Related images\" section below. Review the instructions for  <a href=\"/en/news/newswork/how-submit-newswork-article#a6\" target=\"_blank\">images</a>.</span>\r\n\r\n<span class=\"french-only\">\r\nVeuillez copier/coller l’article dans l’espace ci-dessous (ne pas inclure le titre). Si  l’article contient des images, indiquez à quel endroit ces dernières doivent être insérées dans l’article. Les images doivent être joints  dans la section « Images connexes » ci-dessous. Consultez les <a href=\"/fr/nouvelles/newswork/comment-soumettre-article-pour-nouvelleslouvrage#a6\" target=\"_blank\">instructions sur les images</a>.</span>"
        required_fields: true
    group_newstranslationreqnum:
      children:
        - field_newstranslationnum
      label: 'Translation request number'
      region: content
      parent_name: ''
      weight: 2
      format_type: details
      format_settings:
        classes: never-collapse
        show_empty_fields: false
        id: ''
        open: true
        description: "<span class=\"english-only\">Enter the <a href=\"/en/public-affairs-branch/translation-and-revision-services\" target=\"_blank\">Translation and Revision Services</a> request number. </span>\r\n\r\n<span class=\"french-only\">Veuillez fournir le numéro de demande de traduction de la <a href=\"https://agrisource.agr.gc.ca/fr/directions-generales-et-bureaux/direction-generale-des-affaires-publiques/service-traduction-et-revision/services-offerts#a\" target=\"_blank\">Service de traduction et de révision</a>.  </span>"
        required_fields: true
    group_newsposteddate:
      children:
        - field_posted
      label: 'Posting date'
      region: content
      parent_name: ''
      weight: 4
      format_type: details
      format_settings:
        classes: never-collapse
        id: ''
        open: true
        description: '<span class=\"english-only\">When do you want the article published?</span>\r\n\r\n<span class=\"french-only\">À quelle date voulez-vous publier votre article?\r\n</span>'
        required_fields: true
    group_newsnotes:
      children:
        - field_newsnotes
        - group_preview
      label: Notes
      region: content
      parent_name: ''
      weight: 9
      format_type: details
      format_settings:
        classes: never-collapse
        id: ''
        open: true
        description: ''
        required_fields: true
    group_newsattachedfiles:
      children:
        - field_newsfile5
      label: 'Related images'
      region: content
      parent_name: ''
      weight: 8
      format_type: details
      format_settings:
        classes: never-collapse
        show_empty_fields: false
        id: ''
        open: true
        description: "<span class=\"english-only\">Click \"Add media\" to add images to the article. Review the instructions for <a href=\"/en/news/newswork/how-submit-newswork-article#a6\" target=\"_blank\">images</a>.</span>\r\n\r\n<span class=\"french-only\">\r\nSi l’article contient des photos, cliquez sur « Joindre des médias». Consultez les <a href=\"/fr/nouvelles/newswork/comment-soumettre-article-pour-nouvelleslouvrage#a6\" target=\"_blank\">instructions sur les images</a>.\r\n</span>"
        required_fields: true
    group_testingdetailsgroup:
      children:
        - field_description
        - field_keywords
        - field_created_by
        - field_dc_date_created
        - field_issued
        - field_modified
      label: 'aafc metadata group'
      region: content
      parent_name: ''
      weight: 13
      format_type: details_sidebar
      format_settings:
        classes: ''
        id: ''
        open: false
        description: ''
        required_fields: true
        weight: -50
    group_newsaafcdectermstype:
      children:
        - field_meta_type
      label: aafc-dcterms-gctype
      region: content
      parent_name: ''
      weight: 14
      format_type: details_sidebar
      format_settings:
        classes: ''
        id: ''
        open: false
        description: ''
        required_fields: true
        weight: -44
    group_newsaafcdctermssubject:
      children:
        - field_subject
      label: aafc-dcterms-subject
      region: content
      parent_name: ''
      weight: 15
      format_type: details_sidebar
      format_settings:
        classes: ''
        id: ''
        open: false
        description: ''
        required_fields: true
        weight: -43
    group_preview:
      children: {  }
      label: Preview
      region: content
      parent_name: group_newsnotes
      weight: 11
      format_type: details
      format_settings:
        classes: ''
        show_empty_fields: true
        id: ''
        open: true
        description: "<span class=\"english-only\"><p>Preview your article to see how it will look in news@work. The preview will open in a new window. If your article doesn't appear correct, close the preview window and edit it in the space provided in the form, or add a comment in the \"notes\" section.</p> \r\n\r\n<p>When you've completed and previewed your article, click submit to send it to the news@work coordinator.</p></span>\r\n\r\n<span class=\"french-only\"><p>Voyez comment l’article figurera dans nouvelles@l’ouvrage. Un aperçu s’affichera dans une nouvelle fenêtre. Si vous notez des erreurs, fermez la fenêtre et apportez les modifications nécessaires dans l'espace fourni à cet effet dans le formulaire. Utilisez la section « Commentaires » pour ajouter des instructions, au besoin.</p>\r\n\r\n<p>Après avoir revu l’article, cliquez sur « Soumettre » pour l’envoyer au coordonnateur de nouvelles@l’ouvrage.</p></span>"
        required_fields: false
