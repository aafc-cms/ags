          relationship: none
          group_type: group
          admin_label: ''
          empty: true
          tokenize: false
          content: "<p>Please note: As of March 16, 2020, news@work is limited to priority news and updates related to COVID-19 or business continuity. These priority articles will continue to be published on the news@work page, but the weekly email bulletin has been suspended for the time being. Thank you for your cooperation and understanding.</p>\r\n\r\n<p><i>news@work</i> brings you important information about departmental news and events. <i>news@work</i> articles are posted in this section throughout the week, and an email bulletin of current articles is sent to all staff on Thursdays.</p>\r\n\r\n<ul>\r\n<li><a href=\"display-afficher.do?id=1305895655987&amp;lang=eng\">Submit an article</a> (consult the <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=102428321&amp;lang=eng\" target=\"_blank\">checklist and style guide (Word)</a>). </li>\r\n<li><a href=\"display-afficher.do?id=1319728307118&amp;lang=eng\">Search previous <i>news@work</i> articles</a>.</li>\r\n<li><a href=\"https://collab.agr.gc.ca/br-dg/ccb-dgcc/Lists/bulletins/AllItems.aspx\" rel=\"internal\">View previous <i>news@work</i> bulletins</a> in Knowledge Workspace.</li>\r\n<li>Contact us at <a href=\"mailto:aafc.newsatwork-nouvellesalouvrage.aac@canada.ca\">aafc.newsatwork-nouvellesalouvrage.aac@canada.ca</a> if  you have any questions or comments about <i>news@work</i></li>\r\n</ul>"
