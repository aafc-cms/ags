      header:
        area_text_custom:
          content: "\r\n<div class=\"alert alert-info\">\r\n<p class=\"french-only\"> Veuillez noter que, à compter du 16 mars 2020, le bulletin nouvelles@l’ouvrage ne publiera que les nouvelles prioritaires et les mises à jour liées à la COVID-19 ou à la continuité des activités. Ces articles prioritaires continueront de paraître dans la page de nouvelles@l’ouvrage, mais l’envoi du bulletin hebdomadaire par courriel est suspendu. Nous vous remercions de votre collaboration et de votre compréhension.</p>\r\n</div>\r\n\r\n<p>Le bulletin <i>nouvelles@l'ouvrage</i> vous communique des renseignements importants sur les événements et les initiatives du Ministère. Les articles de <i>nouvelles@l'ouvrage</i> sont affichés tout au long de la semaine dans la présente section. Le jeudi, un bulletin regroupant l'ensemble des articles est envoyé par courriel à tous les employés.</p>\r\n\r\n<ul> \r\n <li>Pour <a href=\"display-afficher.do?id=1305895655987&amp;lang=fra\">soumettre un article</a> (consultez  <a href=\"http://intranet.agr.gc.ca/agrisource/AgriDoc.do?id=103093636&amp;lang=fra\" target=\"_blank\">la liste de points à vérifier et le guide de rédaction (Word)</a>). </li>\r\n<li>Vous pouvez <a href=\"display-afficher.do?id=1319728307118&amp;lang=fra\">rechercher des articles déjà parus dans <i>nouvelles@l'ouvrage</i></a>.</li>\r\n<li>Il vous est également possible de consulter les <a href=\"https://collab.agr.gc.ca/br-dg/ccb-dgcc/Lists/bulletins/AllItems.aspx\" rel=\"internal\">précédents bulletins <i>nouvelles@l'ouvrage</i></a> dans l'Espace de travail du savoir.</li>\r\n<li>Si vous avez des questions ou des commentaires au sujet de <i>nouvelles@l'ouvrage</i>, veuillez communiquer avec nous à <a href=\"mailto:aafc.newsatwork-nouvellesalouvrage.aac@canada.ca\">aafc.newsatwork-nouvellesalouvrage.aac@canada.ca</a>.</li>\r\n</ul>\r\n\r\n"
      title: 'nouvelles@l''ouvrage'
