display:
  default:
    display_options:
      fields:
        field_type:
          admin_label: 'Type of opportunity'
        field_classification:
          admin_label: 'Group, level and position'
        field_branch:
          admin_label: 'Direction générale'
        field_open_to:
          admin_label: 'Ouvert à'
        field_locations:
          admin_label: Lieu
        field_date_closing:
          admin_label: 'Date de clôture'
      header:
        area:
          content:
            value: "<p class=\"english-only\">Below is a list of current acting, assignment and deployment opportunities available only to Agriculture and Agri-Food Canada (AAFC) employees.</p>\r\n\r\n<p class=\"english-only\">The <i>Branch, Open to, Location</i> and <i>Closing date</i> fields can be filtered in ascending or descending order by selecting the column title.</p>\r\n\r\n<p class=\"french-only\">Vous trouverez ci-dessous une liste des possibilités de nomination intérimaire, d'affectation et de mutation actuellement offertes exclusivement aux employés d'Agriculture et Agroalimentaire Canada (AAC).</p>\r\n\r\n<p class=\"french-only\">Vous pouvez filtrer les éléments des colonnes <i>Direction générale, Ouvert à, Lieu</i> et <i>Date de cl<em>ô</em>ture</i> en sélectionnant le titre de ces colonnes.</p>\r\n\r\n<p>&nbsp;</p>\r\n"
            format: full_html
      footer:
        area:
          content:
            value: "<p>&nbsp;</p>\r\n\r\n<p class=\"english-only\"><b>Note:</b> Not all AAFC job opportunities are posted on this page. Employees should monitor and check employment opportunities on the <a href=\"https://emploisfp-psjobs.cfp-psc.gc.ca/psrs-srfp/applicant/page2440?fromMenu=true&amp;toggleLanguage=en\">Public Service Jobs</a> page on a regular basis to view all employment opportunities within AAFC and other departments.</p>\r\n\r\n<p class=\"english-only\">If you have an internal employment opportunity you would like to post, please see our <a href=\"display-afficher.do?id=1287680969053&amp;lang=eng\">internal employment opportunity posting process</a>.</p>\r\n\r\n<p class=\"french-only\"><b>Remarque&nbsp;:</b> Les possibilités d'emploi à AAC ne sont pas toutes affichées sur cette page. Il est conseillé aux employés de consulter régulièrement le site <a href=\"https://emploisfp-psjobs.cfp-psc.gc.ca/psrs-srfp/applicant/page2440?fromMenu=true&amp;toggleLanguage=fr\">Emplois à la fonction publique</a> pour voir toutes les possibilités à AAC et dans les autres ministères.</p>\r\n\r\n<p class=\"french-only\">Si vous souhaitez annoncer une possibilité d'emploi, à l'interne veuillez consulter la page consacrée au <a href=\"display-afficher.do?id=1287680969053&amp;lang=fra\">processus relatif à la publication des possibilités d'emploi à l'interne</a>.</p>\r\n"
            format: rich_text
