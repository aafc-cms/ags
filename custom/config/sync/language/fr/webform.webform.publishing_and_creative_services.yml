title: 'Formulaire de demande des services d’édition'
description: "<p>Les informations fournies ci-dessous vous aideront à entreprendre votre projet de publication. Une fois ces informations soumises, les Services de publication et de création communiqueront avec vous dans les deux jours ouvrables.</p>\r\n\r\n<p>Si vous quittez cette page avant de soumettre votre formulaire, les informations seront perdues.</p>"
elements: "psrf_pagedescription:\n  '#text': \"<p>Les informations fournies ci-dessous vous aideront à entreprendre votre projet de publication. Une fois ces informations soumises, les Services de publication et de création communiqueront avec vous dans les deux jours ouvrables.</p>\\n\\n<p>Si vous quittez cette page avant de soumettre votre formulaire, les informations seront perdues.</p>\\n\"\npsrf_section_networkusername:\n  '#title': 'Nom d’utilisateur réseau'\nsrf_networkusername:\n  '#title': 'Nom d’utilisateur réseau'\npsrf_section_contactinformation:\n  '#title': 'Coordonnées de la personne-ressource'\nsrf_name:\n  '#title': Nom\nsrf_phone:\n  '#title': Téléphone\nsrf_email:\n  '#title': Courriel\nsrf_branch:\n  '#title': 'Direction générale'\npsrf_section_requestdetails:\n  '#title': 'Détails sur la demande'\nsrf_isnewrequestorexistingproject:\n  '#title': 'S’agit-il d’une nouvelle demande ou d’une mise à jour d’un projet existant?'\n  '#options':\n    New: Nouvelle\n    Update: 'Mise à jour'\nrsf_projecttitle:\n  '#title': 'Titre du projet'\nrsf_daterequired:\n  '#title': 'Date d’échéance'\nsrf_isrequesttoscheduledevent:\n  '#title': 'Cette demande est-elle liée à une activité planifiée?'\nsrf_departmentalpriority:\n  '#title': 'Veuillez indiquer quelle est la priorité ministérielle qu’appuie votre demande de publication'\nsrf_mainmessage:\n  '#title': 'Quel est le message principal que vous souhaitez communiquer?'\nsrf_targetaudience:\n  '#title': 'Public cible'\n  '#options':\n    'AAFC Employees': 'Employés d’AAC'\n    'Agri-Food Industry': 'Industrie agroalimentaire'\n    Consumers: Consommateurs\n    'Educational Institution': 'Établissements d’enseignement'\n    'General Public': 'Grand public'\n    International: 'Communauté internationale'\n    Media: Médias\n    Producers: Producteurs\n    'Scientific Community': 'Communauté scientifique'\n    Youth: Jeunes\nsrf_hascommadvisorapproved:\n  '#title': 'Votre conseiller en communication a-t-il approuvé ce projet?'\n  '#options':\n    'Yes': Oui\n    'No': Non\npsrf_section_productsrequired:\n  '#title': 'Produits demandés'\nsrf_html_selectproducts:\n  '#markup': 'Veuillez sélectionner les produits dont vous avez besoin dans le menu déroulant. Pour sélectionner plusieurs produits, gardez la touche CTRL enfoncée en cliquant.'\nsrf_product:\n  '#title': Produit\n  '#options':\n    'AAFC# / ISBN # / ISSN #</': 'Numéro d’AAC / d’ISBN / d’ISSN'\n    'Advertisement / Public Notice': 'Publicité / avis public'\n    'Advice / Info / Inquiry': 'Conseils / information / demande de renseignements'\n    'Banner Stand': Porte-bannière\n    Binder: Classeur\n    Book: Livre\n    Booklet: Livret\n    Calendar: Calendrier\n    Certificate: Certificat\n    'Copyright Request': 'Demande de droit d’auteur'\n    'Cover Page': 'Page couverture'\n    'Exhibit Display': 'Présentoir d’exposition'\n    'Graphic Design': 'Conception graphique'\n    Handbook: Manuel\n    Illustration: Illustrations\n    'Information Card': 'Carte d’information'\n    Map: Carte\n    'Minister’s Message': 'Message du ministre'\n    'Photo Research': 'Recherche de photos'\n    'Photography Services': 'Services de photographie'\n    Poster: Affiche\n    'Promotional Item': 'Article de promotion'\n    Report: Rapport\n    Signage: Signalisation\n    'Social Media': 'Médias sociaux'\n    Template: Gabarit\n    'Visual Identifier': 'Identificateur visuel'\n    'Website Graphics': 'Éléments graphiques d’un site Web'\npsrf_section_additionalcomments:\n  '#title': 'Commentaires additionnels'\nsrf_addintionalcomments:\n  '#title': 'Veuillez fournir une brève description du produit demandé, y compris toute information supplémentaire ou observation particulière'\npsrf_section_content_approval:\n  '#title': 'Approbation du contenu'\nsrf_hascontentpproved:\n  '#title': 'Le contenu a-t-il été approuvé ?'\n  '#options':\n    'Yes': Oui\n    'No': Non\nsrf_html_approvernametitle:\n  '#markup': 'Veuillez indiquer le nom et le titre de la personne qui a approuvé le contenu :'\nsrf_approvername:\n  '#title': Nom\nsrf_approvertitle:\n  '#title': Titre\nsrf_contentfinalizedinenglishandfrench:\n  '#title': 'Le contenu est-il final en anglais et en français?'\nattach_communication_plan:\n  '#title': 'Veuillez joindre toute documentation à l&#39;appui de votre demande, y compris votre plan de communication approuvé, des visuels et toutes informations offrants du contexte :'\npsrf_section_attachments:\n  '#title': 'Pièces jointes'\npsrf_details_attachallfiles:\n  '#title': 'Veuillez joindre tous les fichiers requis pour cette demande :'\nsrf_attachedfiles:\n  '#title': 'Sélectionnez le fichiers'\npsrf_attachmentdescription:\n  '#text': '<i>Annexez les fichiers TXT, DOC, DOCX, WPD, HTML, PDF, XML, JPG, JPEG, GIF, BMP, CSS, ZIP, XLS, AVI, MPG, MPEG, PNG, PPT anglais et français reliés à cette demande. Si plus de 6 fichiers doivent être annexés, veuillez utiliser un utilitaire ZIP pour les archiver et ensuite soumettez le fichier ZIP.</i>'\nactions:\n  '#submit__label': Soumettre\n  '#reset__label': Réinitialiser\npsrf_pagefootermessage:\n  '#text': \"<main property=\\\"mainContentOfPage\\\" role=\\\"main\\\">\\n<section>\\n<p>Nota : Lorsque le formulaire rempli arrivera dans la boîte de réception des Publications, un agent de projets communiquera avec vous dans deux jours ouvrables.</p>\\n</section>\\n</main>\"\n"
