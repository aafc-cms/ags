What is the main message you wish to communicate?</strong></span> <span class=\"display_en_hide_fr\"><strong>Quel est le message principal que vous souhaitez communiquer?</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_mainmessage]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Target Audience</strong></span> <span class=\"display_en_hide_fr\"><strong>Public cible</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_targetaudience]</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td>&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Has your Communications Advisor approved this project?</strong></span> <span class=\"display_en_hide_fr\"><strong>Has your Communications Advisor approved this project?/Votre conseiller en communication a-t-il approuv&eacute; ce projet?</strong></span></td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"padding-left:2px\">[webform_submission:values:srf_hascommadvisorapproved]</td>\r\n\t\t</tr>\r\n\t</tbody>\r\n</table>\r\n</div>\r\n\r\n<div style=\"height: 25px;\">&nbsp;</div>\r\n\r\n<div>\r\n<table>\r\n\t<tbody>\r\n\t\t<tr class=\"dispaly_fr_hide_en\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"dispaly_fr_hide_en\">Products Required</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr class=\"display_en_hide_fr\">\r\n\t\t\t<td>\r\n\t\t\t<h2 class=\"display_en_hide_fr\">Produits demand&eacute;s</h2>\r\n\t\t\t</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td style=\"height:10px\">&nbsp;</td>\r\n\t\t</tr>\r\n\t\t<tr>\r\n\t\t\t<td><span class=\"dispaly_fr_hide_en\"><strong>Please select the products you require from the drop down menu. Press CTRL key while clicking to select multiple products.</strong></span> <span class=\"display_en_hide_fr\"><strong>Veuillez s&eacute;lectionner les produits dont vous avez besoin