    '#text': "<h3>Liste détaillée des prises de vue</h3>\r\n\r\n<p>Fournissez une liste des prises de vue est une liste détaillée de chaque photo que vous souhaitez obtenir à l’issue de l’événement. Par exemple, un sous-ministre adjoint posant avec le ministre devant une bannière de campagne, une photo d’employés qui communiquent entre eux, etc.</p>\r\n"
