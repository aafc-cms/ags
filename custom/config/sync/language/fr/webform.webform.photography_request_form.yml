    '#text': "<p>L’équipe Marketing et Services de création s’occupe des demandes de photographie à l’interne liées aux événements ou aux portraits. Dans le cas où il serait impossible de répondre à votre demande de services de photographie à l’interne, nous vous donnerons des conseils pour embaucher un entrepreneur externe.</p>\r\n"
