uuid: 7fd7c59a-0100-41a6-b3cb-243bdc54fab0
langcode: en
status: true
dependencies:
  config:
    - node.type.news
  module:
    - content_moderation
id: publishing_news
label: Publishing_News
type: content_moderation
type_settings:
  states:
    archived_newsstate:
      published: false
      default_revision: true
      label: Archived
      weight: 3
    delete_newsstate:
      published: false
      default_revision: true
      label: Delete
      weight: 0
    draft:
      label: Draft
      published: false
      default_revision: false
      weight: -2
    emergency_publish_newsstate:
      published: true
      default_revision: true
      label: 'Emergency Publish'
      weight: 2
    published:
      label: Published
      published: true
      default_revision: true
      weight: 1
    send_to_review_newsstate:
      published: false
      default_revision: false
      label: 'Send to review'
      weight: -1
  transitions:
    delete_newsstrans:
      label: Delete
      from:
        - delete_newsstate
        - draft
        - emergency_publish_newsstate
        - published
      to: archived_newsstate
      weight: 4
    emergency_publish_newsstrans:
      label: 'Emergency publish'
      from:
        - draft
        - emergency_publish_newsstate
        - published
      to: emergency_publish_newsstate
      weight: 3
    publish:
      label: Publish
      to: published
      weight: 0
      from:
        - draft
        - published
    publish_archived_content_newsstrans:
      label: 'Publish archived content'
      from:
        - archived_newsstate
      to: draft
      weight: 2
    save_as_a_draft_newsstrans:
      label: 'Save as a draft'
      from:
        - draft
        - emergency_publish_newsstate
        - published
      to: draft
      weight: -1
    send_for_deletion_newsstrans:
      label: 'Send for deletion'
      from:
        - archived_newsstate
      to: delete_newsstate
      weight: 1
    send_to_reviewer_newstrans:
      label: 'Send to reviewer'
      from:
        - draft
      to: send_to_review_newsstate
      weight: -2
  entity_types:
    node:
      - news
  default_moderation_state: draft
