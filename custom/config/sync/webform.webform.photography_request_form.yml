id: photography_request_form
title: 'Photography request form'
description: ''
categories:
  - 'Services Request Form'
elements: |-
  processed_text:
    '#type': processed_text
    '#text': |
      <p>The Marketing and Creative Services team supports internal requests for photography related to events and headshots. If your request cannot be covered internally, we will provide guidance for hiring an outside contractor.</p>
    '#format': full_html
  h2_1:
    '#type': processed_text
    '#text': |
      <h2>Contact information</h2>
    '#format': full_html
  requester_s_name:
    '#type': textfield
    '#title': 'Requester’s name'
    '#required': true
    '#required_error': 'Name is required'
  email:
    '#type': email
    '#title': Email
    '#required': true
    '#required_error': 'Email is required'
  branch:
    '#type': select
    '#title': Branch
    '#options':
      CMB: 'Corporate Management Branch'
      DMO: "Deputy Minister's Office"
      ISB: 'Information Systems Branch'
      IAB: 'International Affairs Branch'
      LS: 'Legal Services'
      MISB: 'Market and Industry Services Branch'
      OAE: 'Office of Audit and Evaluation'
      OCDO: 'Office of the Chief Data Officer'
      OMBO: 'Ombuds Office'
      PRB: 'Programs Branch'
      PAB: 'Public Affairs Branch'
      STB: 'Science and Technology Branch'
      SPB: 'Strategic Policy Branch'
    '#required': true
    '#required_error': 'Branch is required'
  director_level_or_above_who_was_consulted_or_initiated_this_requ:
    '#type': textfield
    '#title': 'Director level or above who was consulted or initiated this request'
    '#required': true
  h2_2:
    '#type': processed_text
    '#text': |
      <h2>Project information</h2>
    '#format': full_html
  subject_or_subject_matter_:
    '#type': textfield
    '#title': 'Subject or subject matter'
    '#required': true
  event_date:
    '#type': date
    '#title': 'Event date'
    '#required': true
    '#required_error': 'Date is required'
    '#datepicker': true
    '#datepicker_button': true
  photographer_start_time:
    '#type': webform_time
    '#title': 'Photographer start time'
    '#required': true
    '#required_error': 'Start time is required'
    '#timepicker': true
    '#time_format': 'g:i A'
    '#step': 900
  photographer_end_time:
    '#type': webform_time
    '#title': 'Photographer end time'
    '#required': true
    '#required_error': 'End time is required'
    '#timepicker': true
    '#time_format': 'g:i A'
    '#step': 900
  additional_date_and_times_when_you_will_need_a_photographer_:
    '#type': textfield
    '#title': 'Additional date and times when you will need a photographer'
  who_is_the_target_audience_for_your_photos_:
    '#type': webform_checkboxes_other
    '#title': 'Who is the target audience for your photos?'
    '#options':
      AAFC: 'AAFC employees'
      pub: 'Public facing'
    '#other__option_label': 'Other (please specify)'
    '#other__title': 'Other (please specify)'
    '#other__placeholder': ...
    '#required': true
    '#required_error': 'Audience is required'
  where_will_these_photos_be_used_please_check_all_that_apply_:
    '#type': fieldset
    '#title': 'Where will these photos be used? Please check all that apply.'
    '#required': true
    internal:
      '#type': webform_checkboxes_other
      '#title': Internal
      '#options':
        nwa: 'news@work article'
        hrv: 'The Harvest'
        ac: 'AgriSource carousel'
        oc: 'Org chart'
      '#other__placeholder': Other…
    external:
      '#type': webform_checkboxes_other
      '#title': External
      '#options':
        sm: 'Social media'
        pnt: Print
        wb: Website
      '#other__placeholder': Other…
  processed_text_03:
    '#type': processed_text
    '#text': |
      <h3>Detailed shot list</h3>

      <p>Provide an itemized list of each photo deliverable you require from the event. For example, assistant deputy minister posing with the Minister in front of a stand-up campaign banner, photo of employees engaging, etc.</p>
    '#format': full_html
  shot_list:
    '#type': textarea
    '#title': 'Shot list'
    '#title_display': invisible
css: ''
javascript: "(function ($, Drupal) {\r\n  //set timepicker format like '03 h 15' for French\r\n  Drupal.behaviors.timepickerFrench = {\r\n    attach: function (context, settings) {\r\n\t  tmFields = $('.webform-time');\r\n\t  if (tmFields.length === 0) {\r\n\t\treturn;\r\n\t  }\r\n\r\n      const lang = drupalSettings.path.currentLanguage;\r\n      if (lang === 'fr') {\r\n        tmFields.each(function () {\r\n        //step attribute is 'any', pick it from data-msg-step\r\n        attr = $(this).attr('data-msg-step');\r\n        stp = 15;\r\n        if (attr != undefined) {\r\n          mt = attr.match(/\\d+/);\r\n          if (mt) {\r\n            stp = parseInt(mt[0])/60;\r\n          }\r\n        }\r\n        //set format\r\n        $(this).timepicker({\r\n          timeFormat: 'H \\\\h i',\r\n          step: stp,\r\n          scrollDefault: 'now'\r\n        });\r\n      });\r\n     }\r\n    }\r\n  };\r\n})(jQuery, Drupal);\r\n"
