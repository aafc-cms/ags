    - filter.format.full_html
  module:
    - ckeditor
format: full_html
editor: ckeditor
settings:
  toolbar:
    rows:
      -
        -
          name: Formatting
          items:
            - Bold
            - Italic
            - Underline
            - Strike
            - JustifyLeft
            - JustifyCenter
            - JustifyBlock
            - JustifyRight
            - RemoveFormat
            - SpecialChar
            - Superscript
            - Subscript
            - Format
            - Styles
            - Outdent
            - Indent
            - HorizontalRule
            - Table
            - Blockquote
        -
          name: Links
          items:
            - DrupalLink
            - DrupalUnlink
        -
          name: Lists
          items:
            - BulletedList
            - NumberedList
        -
          name: Media
          items:
            - node
            - DrupalMediaLibrary
        -
          name: Tools
          items:
            - Source
            - ShowBlocks
        -
          name: Editing
          items:
            - Maximize
            - Copy
            - Cut
            - Paste
            - Undo
            - Redo
  plugins:
    stylescombo:
      styles: ''
    drupallink:
      linkit_enabled: true
      linkit_profile: urltodocument
    language:
      language_list: un
    codemirror:
      enable: true
      startupMode: wysiwyg
      mode: htmlmixed
      theme: monokai
