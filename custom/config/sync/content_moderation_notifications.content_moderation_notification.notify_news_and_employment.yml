subject: "Your article has been submitted to news@work / Votre article a été soumis au coordonnateur de nouvelles@l'ouvrage"
body:
  value: "<p>La version française suit</p>\r\n\r\n<p>The article \"<strong>[agri-admin:title]</strong>\" was just submitted to news@work. To preview the article, visit:<br />\r\n[agri-admin:unpublished-url]</p>\r\n\r\n<p>Your request will be processed shortly. If you have any questions, please email the <a href=\"mailto:newsatwork@agr.gc.ca\" style=\"color:blue; text-decoration:underline\">news@work Coordinator</a>.</p>\r\n\r\n<hr align=\"center\" size=\"2\" width=\"100%\" />\r\n<p>L'article «<strong> [agri-admin:translation-title]</strong> » vient d'être soumis au coordonnateur de nouvelles@l'ouvrage. Pour visualiser l'article, rendez-vous à l'adresse suivante :<br />\r\n[agri-admin:translation-unpublished-url]<br />\r\n<br />\r\nNous traiterons votre demande dans les plus brefs délais. Si vous avez des questions, veuillez communiquer avec le coordonnateur de <a href=\"mailto:newsatwork@agr.gc.ca\" style=\"color:blue; text-decoration:underline\">nouvelles@l'ouvrage</a>.</p>\r\n"
  format: full_html
label: 'Notify news and employment'
