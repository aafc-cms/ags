body:
  value: "<p><span style=\"font-size:12pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\"><span style=\"color:black\">La version française suit </span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\"><span style=\"color:black\"></span></span></span><span style=\"font-size:12pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\"><span style=\"color:black\">The article \"<strong>[agri-admin:title]</strong>\" was just submitted to news@work. To preview the article, visit:<br />[agri-admin:unpublished-url]</span></span></span></p>\r\n\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\"><span style=\"color:black\">Your request will be processed shortly. If you have any questions, please email the <a href=\"mailto:newsatwork@agr.gc.ca\" style=\"color:blue; text-decoration:underline\">news@work Coordinator</a> or reply to this message.</span></span></span></p>\r\n\r\n<hr align=\"center\" size=\"2\" width=\"100%\" />\r\n<p><span style=\"font-size:12pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\"><span style=\"color:black\"></span></span></span><span style=\"font-size:12pt\"><span style=\"font-family:&quot;Times New Roman&quot;,serif\"><span style=\"color:black\">L'article «<strong> [agri-admin:translation-title]</strong> » vient d'être soumis au coordonnateur de nouvelles@l'ouvrage. Pour visualiser l'article, rendez-vous à l'adresse suivante :<br />[agri-admin:translation-unpublished-url]<br />\r\n<br />\r\nNous traiterons votre demande dans les plus brefs délais. Si vous avez des questions, veuillez communiquer avec le coordonnateur de <a href=\"mailto:newsatwork@agr.gc.ca\" style=\"color:blue; text-decoration:underline\">nouvelles@l'ouvrage</a> ou répondre au présent message.</span></span></span></p>\r\n"
  format: full_html
