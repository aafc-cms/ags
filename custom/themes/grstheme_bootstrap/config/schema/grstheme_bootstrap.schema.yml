# Schema for the theme setting configuration file of the grstheme_bootstrap theme.

grstheme_bootstrap.settings:
  type: theme_settings
  label: 'Agrisource bootstrap theme settings'
  mapping:
    cdn_provider:
      type: string
      label: 'CDN Provider'
    breadcrumb_home:
      type: integer
      label: 'Breadcrumb Home'
