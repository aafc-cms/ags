news_bulletin.content:
  path: '/news-at-work-bulletin'
  defaults:
    _controller: '\Drupal\news_bulletin\Controller\NewsBulletinController::content'
    _title: 'news@work Bulletin - NCR only'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
news_bulletin_nonncr.content:
  path: '//news-at-work-bulletin/outside-ncr'
  defaults:
    _controller: '\Drupal\news_bulletin\Controller\NewsBulletinController::content'
    _title: 'news@work Bulletin - Outside NCR'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
news_bulletin.set_temp_config:
  path: '/news-at-work-bulletin/set_temp_config'
  defaults:
    _controller: '\Drupal\news_bulletin\Controller\NewsBulletinController::setTempConfig'
  requirements:
    _permission: 'access content'
news_bulletin.get_temp_config:
  path: '/news-at-work-bulletin/get_temp_config'
  defaults:
    _controller: '\Drupal\news_bulletin\Controller\NewsBulletinController::getTempConfig'
  requirements:
    _permission: 'access content'
email_template.content:
  path: '/news-bulletin-email'
  defaults:
    _controller: '\Drupal\news_bulletin\Controller\NewsBulletinEmailController::content'
    _title: 'News Bulletin Email'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
news_bulletin_nonncr.set_temp_config:
  path: '/news-at-work-bulletin/outside-ncr/set_temp_config'
  defaults:
    _controller: '\Drupal\news_bulletin\Controller\NewsBulletinController::setTempConfig'
  requirements:
    _permission: 'access content'
news_bulletin_nonncr.get_temp_config:
  path: '/news-at-work-bulletin/outside-ncr/get_temp_config'
  defaults:
    _controller: '\Drupal\news_bulletin\Controller\NewsBulletinController::getTempConfig'
  requirements:
    _permission: 'access content'